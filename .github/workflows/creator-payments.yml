    name: Calculate Payments
    runs-on: ubuntu-latest
    outputs:
      payment_count: ${{ steps.calculate.outputs.count }}
      total_amount: ${{ steps.calculate.outputs.total }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Calculate payment amounts
        id: calculate
        run: |
          echo "Calculating ${{ inputs.payment_type || 'royalties' }} payments..."
          PERIOD="${{ inputs.period || '' }}"
          if [ -z "$PERIOD" ]; then
