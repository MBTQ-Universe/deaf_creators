name: Creator Payment Workflow

on:
  workflow_dispatch:
    inputs:
      payment_type:
        description: "Type of payment run"
        required: true
        type: choice
        options:
          - royalties
          - milestone
          - bonus
          - refund
      period:
        description: "Payment period (YYYY-MM)"
        required: false
        type: string
        default: ""
      creator_id:
        description: "Specific creator ID (leave empty for batch)"
        required: false
        type: string
        default: ""
  schedule:
    # Run monthly royalty payments on the 1st at 00:00 UTC
    - cron: "0 0 1 * *"

env:
  PAYMENT_BATCH_SIZE: 100

